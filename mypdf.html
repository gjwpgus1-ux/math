<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 PDF로 오답노트 — 줍줍닷컴</title>
<meta name="description" content="가지고 계신 PDF에서 문항을 골라 오답노트로 만듭니다. 파일은 기기 밖으로 나가지 않습니다.">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e2e5ea; --ink:#1d2129; --dim:#6b7280;
    --accent:#2563eb; --accent-soft:#eff4ff; --warn:#b45309; --danger:#c0392b; --ok:#15803d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",sans-serif}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);
         color:var(--ink);border-radius:7px;padding:9px 13px}
  button:hover{background:#f0f2f5}
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#1d4ed8}
  button.warn{border-color:#e5c9a0;color:var(--warn);background:#fffaf2}

  header{position:sticky;top:0;z-index:20;background:var(--card);
         border-bottom:1px solid var(--line);padding:11px 20px}
  .hin{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hin a.home{color:var(--ink);text-decoration:none;font-size:15px;font-weight:600;white-space:nowrap}
  .hin a.home b{color:var(--accent);font-weight:800;letter-spacing:-.4px;font-size:17px}
  .hin .sp{flex:1}
  .hin .by{font-size:12.5px;color:var(--dim)}
  .kb{display:inline-block;min-width:15px;margin-left:6px;padding:0 4px;
      border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
      background:#f4f6f8;color:var(--dim);font-family:Consolas,monospace;
      font-size:10.5px;line-height:15px;vertical-align:1px}

  main{max-width:1500px;margin:0 auto;padding:18px 20px 60px}

  /* ── 단계 표시 ── */
  .steps{display:flex;gap:8px;align-items:center;margin:0 0 16px;flex-wrap:wrap}
  .steps .st{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;
             border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--dim)}
  .steps .st i{display:inline-flex;align-items:center;justify-content:center;
               width:19px;height:19px;border-radius:99px;background:#eceff3;
               font-style:normal;font-size:11.5px;color:var(--dim)}
  .steps .st.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
  .steps .st.on i{background:var(--accent);color:#fff}
  .steps .st.done{color:var(--ok);border-color:#cfe8d6;background:#f2f9f4}
  .steps .st.done i{background:var(--ok);color:#fff}
  .steps .ar{color:var(--dim);font-size:12px}

  /* ── 1단계 : 파일 받기 ── */
  #drop{border:2px dashed #c8d2e0;border-radius:14px;background:var(--card);
        padding:46px 24px;text-align:center;transition:all .15s}
  #drop.over{border-color:var(--accent);background:var(--accent-soft)}
  #drop h2{margin:0 0 8px;font-size:19px}
  #drop p{margin:0 0 18px;color:var(--dim);font-size:13.5px;line-height:1.7}
  #drop .big{font-size:34px;margin-bottom:10px}
  .safe{max-width:640px;margin:20px auto 0;padding:13px 16px;border-radius:10px;
        background:#f2f9f4;border:1px solid #cfe8d6;color:#256b3c;font-size:13px;line-height:1.7;text-align:left}
  .safe b{color:#15803d}

  /* ── 2단계 : 고르기 ── */
  #tools{display:none;position:sticky;top:56px;z-index:15;background:var(--accent-soft);
         border:1px solid #d7e3f7;border-radius:9px;padding:9px 12px;margin:0 0 14px;
         align-items:center;gap:8px;flex-wrap:wrap}
  #tools.on{display:flex}
  #tools .cnt{font-size:13.5px;font-weight:600;color:var(--accent)}
  #tools .pgpos{font-size:13px;color:var(--ink);min-width:74px;text-align:center;
                font-variant-numeric:tabular-nums}
  #tools #prev,#tools #next{padding:5px 11px;font-size:12px}
  #tools button{padding:6px 11px;font-size:12.5px}
  #tools .gap{flex:1}
  #tools .mode{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  #tools .mode button{border:none;border-radius:0}
  #tools .mode button.on{background:var(--accent);color:#fff;font-weight:600}

  /* 한 번에 한 쪽만 보여 준다. 쪽 전체가 화면에 들어오도록 높이에 맞춘다. */
  #pages{display:flex;justify-content:center}
  .pg{position:relative;display:none;background:#fff;border:1px solid var(--line);
      border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden;line-height:0}
  .pg.on{display:inline-block}
  .pg canvas{display:block;height:calc(100vh - 186px);width:auto;max-width:100%;min-height:320px}
  .pgnum{position:absolute;left:8px;top:8px;z-index:3;background:rgba(17,24,39,.72);color:#fff;
         font-size:11.5px;padding:3px 9px;border-radius:99px;pointer-events:none;line-height:1.4}
  .qbox{position:absolute;border:1.5px solid rgba(37,99,235,.42);border-radius:5px;
        background:rgba(37,99,235,.045);cursor:pointer;transition:background .12s}
  .qbox:hover{background:rgba(37,99,235,.13);border-color:var(--accent)}
  .qbox.sel{background:rgba(37,99,235,.17);border-color:var(--accent);border-width:2px}
  .qbox .tick{position:absolute;left:5px;top:5px;width:19px;height:19px;border-radius:5px;
              border:1.5px solid var(--accent);background:#fff;color:#fff;
              display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1}
  .qbox.sel .tick{background:var(--accent)}
  .qbox .del{position:absolute;right:4px;top:4px;width:19px;height:19px;border-radius:5px;
             border:1px solid var(--line);background:#fff;color:var(--danger);
             display:none;align-items:center;justify-content:center;font-size:13px;line-height:1}
  .qbox:hover .del{display:flex}
  .hnd{position:absolute;left:0;right:0;height:9px;cursor:ns-resize;z-index:4}
  .hnd::after{content:'';position:absolute;left:12px;right:12px;top:4px;height:1px;background:transparent}
  .hnd:hover::after{background:var(--accent)}
  .qbox.drawing{background:rgba(21,128,61,.14);border-color:var(--ok)}
  .pg.draw .qbox{cursor:default}
  .pg.draw{cursor:crosshair}

  .note{color:var(--dim);font-size:13px;margin:0 0 14px;line-height:1.75}
  .warnbox{background:#fffaf2;border:1px solid #e5c9a0;color:#8a4b09;border-radius:10px;
           padding:12px 15px;margin:0 0 16px;font-size:13px;line-height:1.7}
  #busy{display:none;padding:40px 10px;text-align:center;color:var(--dim);font-size:14px}
  #busy.on{display:block}
  .bar{height:5px;background:#e6eaf0;border-radius:99px;overflow:hidden;max-width:340px;margin:12px auto 0}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

  #toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);
         background:#111827;color:#fff;padding:11px 20px;border-radius:8px;font-size:14px;
         opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:80vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;
         align-items:center;justify-content:center;z-index:70;padding:20px}
  .modal.open{display:flex}
  .mbox{background:var(--card);border-radius:12px;padding:20px 22px;max-width:460px;width:100%}
  .mbox h3{margin:0 0 6px;font-size:16px}
  .mbox .sub{margin:0 0 14px;color:var(--dim);font-size:13px;line-height:1.7}
  .mb{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

  /* ── 인쇄 양식 ──
     index.html 의 오답노트 양식과 같아야 합니다.
     한쪽만 고치면 두 곳의 결과가 달라지니, 고치실 때는 반드시 두 파일을 함께 보세요.
     (검증 mypdf.js 가 두 파일의 질문·문구가 같은지 매번 확인합니다.) */
  #printArea{display:none}
  #printArea.shoot{display:block;position:fixed;left:-99999px;top:0;background:#fff}
  .sheet{width:190mm;height:277mm;page-break-after:always;overflow:hidden;
         display:flex;flex-direction:column;position:relative}
  .sbody{flex:1;display:flex;min-height:0}
  .shd{height:5mm;font-size:8.5pt;color:#7a7f86;padding-left:1mm}
  .pgn{height:7mm;font-size:9pt;color:#555;padding-top:1.5mm;position:relative}
  .pgn .pn{display:block;text-align:center}
  .pgn .cpr{position:absolute;right:0;bottom:0.5mm;font-size:7.5pt;color:#8a8f96;white-space:nowrap}
  .sheet:last-child{page-break-after:auto}
  .scol{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 5mm}
  .scol.divider{border-right:1.1px solid #333}
  .slab{font-size:9.5pt;color:#444;margin:0 0 1.5mm;font-weight:bold}
  .sbox{display:flex;margin:0 0 1.5mm}
  .sbox span{width:9mm;height:6mm;border:1px solid #9aa1ab;margin-left:-1px;
             font-size:7pt;color:#c2c8d0;display:flex;align-items:center;justify-content:center}
  .sbox span:first-child{margin-left:0}
  .sslot{flex:1;min-height:0;display:flex;flex-direction:column;padding:3mm 0;overflow:hidden}
  .simg{flex:1;min-height:0;display:flex;align-items:flex-start}
  .sslot img{max-width:100%;max-height:100%;object-fit:contain;object-position:left top}
  .nblk{min-height:0;display:flex;flex-direction:column}
  .nq{font-size:10pt;font-weight:bold;margin:3.5mm 0 1.5mm;flex:none}
  .nlines{flex:1;min-height:0;display:flex;flex-direction:column}
  .nlines div{flex:1;min-height:6mm;border-bottom:1px solid #b9c0c9}
  @media print{
    header,main,#toast,.modal{display:none !important}
    #printArea{display:block}
    body{background:#fff}
    @page{size:A4;margin:10mm}
  }
</style>
</head>
<body>

<header><div class="hin">
  <a class="home" href="index.html">← <b>줍줍닷컴</b></a>
  <span style="font-size:14px;font-weight:600">내 PDF로 오답노트</span>
  <span class="sp"></span>
  <span class="by">제작자 : 허선생</span>
  <button id="helpBtn">❓ 쓰는 법<i class="kb">?</i></button>
</div></header>

<main>
  <div class="steps" id="steps">
    <div class="st on" id="st1"><i>1</i>PDF 열기</div><span class="ar">›</span>
    <div class="st" id="st2"><i>2</i>문항 고르기</div><span class="ar">›</span>
    <div class="st" id="st3"><i>3</i>오답노트 만들기</div>
  </div>

  <div id="drop">
    <div class="big">📄</div>
    <h2>PDF를 여기에 끌어다 놓으세요</h2>
    <p>시험지 PDF에서 문항을 하나씩 잘라 내어 오답노트로 만들어 드립니다.<br>
       저작권 때문에 올릴 수 없는 자료도 괜찮습니다.</p>
    <button class="primary" id="pick" style="padding:11px 22px">파일 고르기</button>
    <input type="file" id="file" accept="application/pdf,.pdf" style="display:none">
    <div class="safe">
      <b>파일은 이 기기 밖으로 나가지 않습니다.</b><br>
      PDF를 읽고 자르는 일은 모두 브라우저 안에서 일어납니다.
      어디에도 올리지 않고, 저장하지도 않습니다. 창을 닫으면 그대로 사라집니다.
      인터넷을 끊고 쓰셔도 똑같이 됩니다.
    </div>
  </div>

  <div id="busy">
    <div id="busyMsg">PDF를 읽는 중입니다…</div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div id="tools">
    <button id="prev" title="이전 쪽 (←)">◀</button>
    <span class="pgpos" id="pgpos">1 / 1쪽</span>
    <button id="next" title="다음 쪽 (→)">▶</button>
    <span class="cnt" id="cnt">고른 문항 0개</span>
    <span class="mode">
      <button id="mSel" class="on">고르기</button>
      <button id="mDraw">직접 그리기</button>
    </span>
    <button id="allPage">이 쪽 전부</button>
    <button id="none">전부 해제</button>
    <span class="gap"></span>
    <button id="again">다른 PDF</button>
    <button class="primary" id="make">오답노트 만들기</button>
  </div>

  <div id="pages"></div>
</main>

<div id="printArea"></div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/html2canvas.min.js"></script>
<script>
(function(){
  'use strict';
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var tt=null;
  function toast(m,bad){
    var t=$('toast'); t.textContent=m; t.style.background=bad?'#b91c1c':'#111827';
    t.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove('on'); },2600);
  }
  function modal(html,onOpen){ $('mbox').innerHTML=html; $('modal').classList.add('open'); if(onOpen) onOpen(); }
  function closeModal(){ $('modal').classList.remove('open'); }
  $('modal').onclick=function(e){ if(e.target===this) closeModal(); };

  /* ================= 문항 경계 찾기 =================
     시험지에서 «단(段)»을 나누고, 단의 왼쪽 여백에서 시작하는 «1.» «2.» 같은
     번호를 찾아 그 사이를 한 문항으로 봅니다.
     글자 위치만 보고 판단하므로 글꼴·과목과 상관없이 같은 방식으로 동작합니다. */

  /* 글줄 묶기 — 위아래로 겹치면 같은 줄로 본다 */
  function toLines(ts){
    var a=ts.slice().sort(function(p,q){ return p.top-q.top || p.x-q.x; });
    var out=[], cur=null;
    a.forEach(function(t){
      if(cur && t.top < cur.bot - Math.min(t.h,cur.h)*0.45){
        cur.items.push(t); cur.bot=Math.max(cur.bot,t.top+t.h); cur.h=Math.max(cur.h,t.h);
      }else{
        cur={top:t.top, bot:t.top+t.h, h:t.h, items:[t]}; out.push(cur);
      }
    });
    out.forEach(function(l){
      l.items.sort(function(p,q){ return p.x-q.x; });
      l.x=l.items[0].x;
      l.s=l.items.map(function(t){ return t.s; }).join('');
    });
    return out;
  }

  /* 단 나누기 — 쪽 가운데에서 «글자가 하나도 없는 가장 넓은 세로 띠»를 찾는다.
     한산한 정도로 고르면 본문 한가운데를 가르는 사고가 나므로 빈 띠를 쓴다.
     머리말·꼬리말은 빼고 본다 — 쪽번호가 하필 두 단 사이에 찍히는 시험지가 많다. */
  function findCols(ts, W, H){
    var band=ts.filter(function(t){ return t.top>H*0.16 && t.top<H*0.85; });
    if(band.length<40) band=ts;
    var lo=Math.round(W*0.43), hi=Math.round(W*0.57), n=hi-lo+1;
    var cov=new Uint8Array(n);
    band.forEach(function(t){
      var a=Math.max(0, Math.floor(t.x)-lo-1), b=Math.min(n, Math.ceil(t.x+t.w)-lo+2);
      for(var k=a;k<b;k++) cov[k]=1;
    });
    var bestLen=0, bestMid=null, k=0;
    while(k<n){
      if(cov[k]){ k++; continue; }
      var j=k; while(j<n && !cov[j]) j++;
      if(j-k>bestLen){ bestLen=j-k; bestMid=lo+(k+j)/2; }
      k=j;
    }
    if(bestMid===null || bestLen<6) return [[0,W]];
    /* 한쪽이 너무 적으면 원래 한 단짜리다 */
    var L=0, R=0;
    ts.forEach(function(t){ if(t.x<bestMid) L++; else R++; });
    if(L < ts.length*0.12 || R < ts.length*0.12) return [[0,W]];
    return [[0,bestMid],[bestMid,W]];
  }

  /* «15.» 이 «15최.» 처럼 글자가 끼어 읽히는 시험지가 있어 점은 있어도 되고 없어도 된다.
     대신 왼쪽 여백에서 시작하고 번호가 늘어난다는 조건으로 걸러 낸다. */
  var NUMPAT=/^\s*([0-9]{1,2})/;
  /* EBS 교재의 문항코드 — «[26010-0009]» 꼴 */
  var CODEPAT=/^\[\d{4,6}[-–]\d{3,5}\]$/;
  /* 쪽머리·꼬리에 늘 찍히는 말 — 이것들이 끼면 왼쪽 여백을 잘못 잡는다 */
  var KW_STRONG=/전국연합|학력평가|모의평가|문제지|저작권|평가원|교육청|홀수형|짝수형/;
  var KW_HEAD=/영역|교시|수학/;
  function isChrome(l, H){
    var s=l.s.replace(/\s/g,'');
    if(!s) return true;
    if(KW_STRONG.test(s)) return true;
    /* 쪽머리는 «4수학영역» 처럼 쪽번호와 붙어 나오기도 한다.
       이것을 문항으로 보면 «4번»이 생겨 진짜 번호를 밀어낸다. 자리와 낱말로 먼저 걸러 낸다. */
    if((l.top < H*0.17 || l.top > H*0.86) && KW_HEAD.test(s)) return true;
    /* «5.연립부등식» 처럼 번호로 시작해 글이 이어지면 쪽머리가 아니라 문항이다.
       이 줄까지 쪽머리로 보면 그 문항을 통째로 놓친다. */
    if(/^[0-9]{1,2}[.．,]?[^0-9]/.test(s) && s.length>=4) return false;
    if(l.top < H*0.17 || l.top > H*0.86) return s.length<=8;   /* 쪽번호 같은 짧은 줄 */
    return false;
  }
  function halfWide(s){
    return s.replace(/[０-９．，]/g, function(c){
      var o=c.charCodeAt(0);
      return o===0xFF0E?'.' : o===0xFF0C?',' : String.fromCharCode(o-0xFEE0);
    });
  }

  /* 후보 가운데 «번호가 차례로 늘어나는 가장 긴 사슬»을 고른다.
     «[4점]» 같은 것이 앞에 끼어들어도 사슬이 짧아 저절로 밀려난다.
     길이가 같으면 번호 사이가 촘촘한 쪽을 고른다. */
  function bestChain(cand){
    var n=cand.length;
    if(!n) return [];
    var len=new Array(n), gap=new Array(n), prev=new Array(n), i, j;
    for(i=0;i<n;i++){ len[i]=1; gap[i]=0; prev[i]=-1;
      for(j=0;j<i;j++){
        var d=cand[i].n-cand[j].n;
        if(d<=0 || d>4) continue;
        if(cand[i].top<=cand[j].top) continue;   /* 같은 줄에서 나온 두 읽기는 함께 못 쓴다 */
        var L=len[j]+1, G=gap[j]+d;
        if(L>len[i] || (L===len[i] && G<gap[i])){ len[i]=L; gap[i]=G; prev[i]=j; }
      }
    }
    var bi=0;
    for(i=1;i<n;i++) if(len[i]>len[bi] || (len[i]===len[bi] && gap[i]<gap[bi])) bi=i;
    var out=[];
    for(i=bi;i>=0;i=prev[i]) out.unshift({n:cand[i].n, top:cand[i].top});
    return out;
  }

  /* 단 하나에서 문항 경계 찾기 */
  function inCol(ts, col, top0, bot0, H){
    var all=toLines(ts);
    var ls=all.filter(function(l){ return !isChrome(l, H); });
    if(!ls.length) return [];
    var hs=ls.map(function(l){ return l.bot-l.top; }).sort(function(a,b){ return a-b; });
    var medH=hs[Math.floor(hs.length/2)] || 10;

    /* 문항번호 후보를 먼저 모으고, 그것들의 왼쪽 끝으로 여백을 정한다.
       모든 줄로 여백을 정하면 쪽머리 한 줄에 통째로 어긋난다. */
    /* ① 문항코드로 나누기 — EBS 수능특강·수능완성 같은 교재는 문항마다
       «[26010-0009]» 꼴의 코드가 바로 위에 붙는다. 번호보다 훨씬 또렷한 자국이라
       코드가 둘 이상 보이면 이것만으로 자른다. */
    var codes=ls.filter(function(l){ return CODEPAT.test(l.s.replace(/\s/g,'')); })
                .sort(function(a,b){ return a.top-b.top; });
    if(codes.length>=2){
      var out0=[];
      codes.forEach(function(c,i){
        var t0=Math.max(top0, c.top - medH*0.4);
        var t1=(i+1<codes.length) ? codes[i+1].top - medH*0.5 : bot0;
        if(t1-t0 >= medH*1.2) out0.push({n:i+1, x0:col[0], x1:col[1], t0:t0, t1:t1});
      });
      if(out0.length) return out0;
    }

    /* ② 문항번호로 나누기 */
    var cand=[];
    ls.forEach(function(l){
      var s=halfWide(l.s);
      var m=NUMPAT.exec(s);
      if(!m) return;
      var rest=s.slice(m[0].length).replace(/^[.．,\s]+/,'');
      if(rest.length<1) return;                   /* 쪽번호처럼 숫자만 있는 줄은 제외 */
      if(/^점/.test(rest)) return;                /* «4점]» 같은 배점 표시는 문항 번호가 아니다 */
      var n=+m[1];
      if(n>=1 && n<=60) cand.push({n:n, top:l.top, x:l.x});
      /* «32P2n=64» 처럼 번호와 수식이 붙어 버리는 교재가 있다.
         두 자리로 읽은 것과 한 자리로 읽은 것을 둘 다 후보에 넣고,
         뒤에서 «번호가 차례로 늘어나는 사슬»이 옳은 쪽을 골라 준다. */
      if(m[1].length===2){
        var n1=+m[1][0];
        if(n1>=1) cand.push({n:n1, top:l.top, x:l.x});
      }
    });
    if(!cand.length) return [];
    var cxs=cand.map(function(c){ return c.x; }).sort(function(a,b){ return a-b; });
    var left=cxs[Math.floor(cxs.length*0.25)];

    cand=cand.filter(function(c){ return Math.abs(c.x-left) <= medH*1.3; });
    cand.sort(function(a,b){ return a.top-b.top; });
    var starts=bestChain(cand);
    if(!starts.length) return [];

    var out=[];
    starts.forEach(function(s,i){
      var t0=Math.max(top0, s.top - medH*0.55);
      var t1=(i+1<starts.length) ? starts[i+1].top - medH*0.55 : bot0;
      if(t1-t0 < medH*1.2) return;
      out.push({n:s.n, x0:col[0], x1:col[1], t0:t0, t1:t1});
    });
    return out;
  }

  /* 한 쪽 전체 */
  function detect(ts, W, H){
    var top0=H*0.055, bot0=H*0.955;
    var body=ts.filter(function(t){
      return t.s && t.s.trim() && t.top>top0 && t.top+t.h<bot0;
    });
    if(body.length<8) return [];
    var cols=findCols(body, W, H), out=[];
    cols.forEach(function(c){
      var inC=body.filter(function(t){ var cx=t.x+t.w/2; return cx>=c[0] && cx<c[1]; });
      if(inC.length>=6) out=out.concat(inCol(inC, c, top0, bot0, H));
    });
    out.sort(function(a,b){ return a.x0-b.x0 || a.t0-b.t0; });
    return out;
  }

  /* ================= PDF 읽기 ================= */
  var PDFJS=null, DOC=null, PAGES=[], SEL={}, MODE='sel', SEQ=0, CUR=0;

  /* 한 번에 한 쪽만 보여 준다 */
  function showPage(i){
    if(!PAGES.length) return;
    CUR=Math.max(0, Math.min(i, PAGES.length-1));
    PAGES.forEach(function(p,k){ p.wrap.classList.toggle('on', k===CUR); });
    $('pgpos').textContent=(CUR+1)+' / '+PAGES.length+'쪽';
    $('prev').disabled=(CUR===0);
    $('next').disabled=(CUR>=PAGES.length-1);
    try{ window.scrollTo(0,0); }catch(e){}
  }
  function goPage(d){ showPage(CUR+d); }

  function loadPdfJs(cb){
    if(window.pdfjsLib){ PDFJS=window.pdfjsLib; return cb(); }
    var s=document.createElement('script');
    s.src='lib/pdf.min.js';
    s.onload=function(){
      PDFJS=window.pdfjsLib;
      if(!PDFJS){ return cb('PDF를 읽는 부품을 불러오지 못했습니다'); }
      PDFJS.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
      cb();
    };
    s.onerror=function(){ cb('PDF를 읽는 부품을 불러오지 못했습니다 (lib/pdf.min.js)'); };
    document.head.appendChild(s);
  }

  function step(n){
    ['st1','st2','st3'].forEach(function(id,i){
      var el=$(id); el.className='st'+(i+1===n?' on':(i+1<n?' done':''));
    });
  }
  function busy(on,msg,pct){
    $('busy').classList.toggle('on',!!on);
    if(msg) $('busyMsg').textContent=msg;
    $('bar').style.width=(pct||0)+'%';
  }

  function openFile(f){
    if(!f) return;
    if(!/\.pdf$/i.test(f.name) && f.type!=='application/pdf'){
      toast('PDF 파일만 열 수 있습니다',true); return;
    }
    $('drop').style.display='none';
    busy(true,'PDF를 읽는 부품을 준비하는 중…',5);
    loadPdfJs(function(err){
      if(err){ busy(false); $('drop').style.display=''; toast(err,true); return; }
      var fr=new FileReader();
      fr.onload=function(){ render(new Uint8Array(fr.result), f.name); };
      fr.onerror=function(){ busy(false); $('drop').style.display=''; toast('파일을 읽지 못했습니다',true); };
      fr.readAsArrayBuffer(f);
    });
  }

  function render(buf, name){
    busy(true,'PDF를 여는 중…',10);
    PDFJS.getDocument({data:buf}).promise.then(function(doc){
      DOC=doc; PAGES=[]; SEL={}; SEQ=0; CUR=0;
      $('pages').innerHTML='';
      var total=doc.numPages, noText=0, done=0;
      var next=function(i){
        if(i>total){
          busy(false); step(2); $('tools').classList.add('on'); updateCnt();
          showPage(0);
          if(noText===total){
            setMode('draw');
            toast('글자가 없는 PDF입니다 — «직접 그리기»로 문항을 그려 주세요');
          }else{
            toast(total+'쪽에서 문항 '+countBoxes()+'개를 찾았습니다 · ← → 로 쪽을 넘기세요');
          }
          return;
        }
        busy(true,'쪽을 그리는 중… ('+i+' / '+total+')', 10+Math.round(i/total*85));
        doc.getPage(i).then(function(pg){
          return drawPage(pg,i).then(function(hadText){ if(!hadText) noText++; done++; next(i+1); });
        }).catch(function(){ done++; next(i+1); });
      };
      next(1);
    }).catch(function(e){
      busy(false); $('drop').style.display='';
      toast('PDF를 열지 못했습니다 ('+(e&&e.message||e)+')',true);
    });
  }

  function drawPage(pg, pno){
    var vp1=pg.getViewport({scale:1});
    var scale=Math.min(2.4, Math.max(1.4, 1500/vp1.width));
    var vp=pg.getViewport({scale:scale});
    var cv=document.createElement('canvas');
    cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
    var ctx=cv.getContext('2d');
    return pg.render({canvasContext:ctx, viewport:vp}).promise.then(function(){
      return pg.getTextContent();
    }).then(function(tc){
      var W=vp1.width, H=vp1.height, ts=[];
      (tc.items||[]).forEach(function(it){
        /* 글자 자리는 «뷰포트 변환»을 거쳐야 쪽에 보이는 자리와 맞는다.
           그냥 transform 값만 쓰면 여백을 잘라 낸 PDF(CropBox)나 돌려 놓은 쪽에서 어긋난다. */
        var m=PDFJS.Util.transform(vp1.transform, it.transform||[1,0,0,1,0,0]);
        /* 옆면에 세로로 찍힌 딱지·워터마크는 글줄을 헝클어뜨리므로 뺀다 */
        if(Math.abs(m[1]) > Math.abs(m[0])*0.3) return;
        var h=Math.hypot(m[2],m[3]) || Math.abs(it.height) || 10;
        var s=it.str||'';
        if(!s.trim() && !(it.width>0)) return;
        ts.push({s:s, x:m[4], top:m[5]-h, w:it.width||0, h:h});
      });

      var boxes=detect(ts, W, H);
      var wrap=document.createElement('div');
      wrap.className='pg';
      wrap.appendChild(cv);
      wrap.insertAdjacentHTML('beforeend','<div class="pgnum">'+pno+'쪽</div>');
      var rec={pno:pno, cv:cv, W:W, H:H, sx:cv.width/W, sy:cv.height/H, wrap:wrap, boxes:[]};
      PAGES.push(rec);
      boxes.forEach(function(b){ addBox(rec, b, true); });
      bindDraw(rec);
      $('pages').appendChild(wrap);
      return ts.length>0;
    });
  }

  /* ================= 네모 하나 ================= */
  function addBox(rec, b, auto){
    var id='b'+(++SEQ);
    var d=document.createElement('div');
    d.className='qbox'; d.dataset.id=id;
    var box={id:id, rec:rec, el:d, x0:b.x0, x1:b.x1, t0:b.t0, t1:b.t1, n:b.n||0, auto:!!auto};
    rec.boxes.push(box);
    /* 문항 번호는 화면에도 오답노트에도 쓰지 않는다.
       자동으로 읽은 번호가 어긋나는 시험지가 있어, 틀린 번호를 보여 주느니 안 보이는 편이 낫다.
       (번호는 문항 차례를 잡는 데에만 속으로 쓴다.) */
    d.innerHTML='<span class="tick">✓</span>'+
      '<span class="del" title="이 네모 지우기">×</span>'+
      '<div class="hnd" style="top:-4px" data-e="t"></div>'+
      '<div class="hnd" style="bottom:-4px" data-e="b"></div>';
    place(box);
    d.onclick=function(ev){
      if(ev.target.classList.contains('del')){ ev.stopPropagation(); dropBox(box); return; }
      if(ev.target.classList.contains('hnd')) return;
      if(MODE==='draw') return;
      toggle(box);
    };
    Array.prototype.forEach.call(d.querySelectorAll('.hnd'), function(h){
      h.onmousedown=function(ev){ startDrag(ev, box, h.dataset.e); };
    });
    rec.wrap.appendChild(d);
    return box;
  }
  function place(b){
    var r=b.rec, pct=function(v,t){ return (v/t*100)+'%'; };
    b.el.style.left=pct(b.x0,r.W); b.el.style.width=pct(b.x1-b.x0,r.W);
    b.el.style.top=pct(b.t0,r.H);  b.el.style.height=pct(b.t1-b.t0,r.H);
  }
  function toggle(b){
    if(SEL[b.id]) delete SEL[b.id]; else SEL[b.id]=b;
    b.el.classList.toggle('sel',!!SEL[b.id]);
    updateCnt();
  }
  function dropBox(b){
    delete SEL[b.id];
    b.rec.boxes=b.rec.boxes.filter(function(x){ return x!==b; });
    if(b.el.parentNode) b.el.parentNode.removeChild(b.el);
    updateCnt();
  }
  function countBoxes(){
    var n=0; PAGES.forEach(function(p){ n+=p.boxes.length; }); return n;
  }
  function updateCnt(){
    var n=Object.keys(SEL).length;
    $('cnt').textContent='고른 문항 '+n+'개';
    $('make').disabled=(n===0);
  }

  /* 경계선 끌기 */
  function startDrag(ev, b, edge){
    ev.preventDefault(); ev.stopPropagation();
    var r=b.rec, rect=r.wrap.getBoundingClientRect();
    var move=function(e){
      var y=(e.clientY-rect.top)/rect.height*r.H;
      if(edge==='t') b.t0=Math.max(0, Math.min(y, b.t1-r.H*0.02));
      else           b.t1=Math.min(r.H, Math.max(y, b.t0+r.H*0.02));
      place(b);
    };
    var up=function(){
      document.removeEventListener('mousemove',move);
      document.removeEventListener('mouseup',up);
    };
    document.addEventListener('mousemove',move);
    document.addEventListener('mouseup',up);
  }

  /* 직접 그리기 */
  function bindDraw(rec){
    rec.wrap.onmousedown=function(ev){
      if(MODE!=='draw') return;
      if(ev.target.classList.contains('hnd') || ev.target.classList.contains('del')) return;
      ev.preventDefault();
      var rect=rec.wrap.getBoundingClientRect();
      var x0=(ev.clientX-rect.left)/rect.width*rec.W;
      var y0=(ev.clientY-rect.top)/rect.height*rec.H;
      var tmp=document.createElement('div');
      tmp.className='qbox drawing'; rec.wrap.appendChild(tmp);
      var cur={x0:x0,x1:x0,t0:y0,t1:y0};
      var move=function(e){
        var x=(e.clientX-rect.left)/rect.width*rec.W;
        var y=(e.clientY-rect.top)/rect.height*rec.H;
        cur.x0=Math.min(x0,x); cur.x1=Math.max(x0,x);
        cur.t0=Math.min(y0,y); cur.t1=Math.max(y0,y);
        tmp.style.left=(cur.x0/rec.W*100)+'%'; tmp.style.width=((cur.x1-cur.x0)/rec.W*100)+'%';
        tmp.style.top=(cur.t0/rec.H*100)+'%';  tmp.style.height=((cur.t1-cur.t0)/rec.H*100)+'%';
      };
      var up=function(){
        document.removeEventListener('mousemove',move);
        document.removeEventListener('mouseup',up);
        if(tmp.parentNode) tmp.parentNode.removeChild(tmp);
        if(cur.x1-cur.x0 > rec.W*0.03 && cur.t1-cur.t0 > rec.H*0.015){
          var nb=addBox(rec, cur, false);
          toggle(nb);
        }
      };
      document.addEventListener('mousemove',move);
      document.addEventListener('mouseup',up);
    };
  }

  function setMode(m){
    MODE=m;
    $('mSel').className=(m==='sel'?'on':'');
    $('mDraw').className=(m==='draw'?'on':'');
    PAGES.forEach(function(p){ p.wrap.classList.toggle('draw', m==='draw'); });
    if(m==='draw') toast('문항을 네모로 끌어 그리시면 바로 골라집니다');
  }

  /* ================= 잘라내기 ================= */
  function cropOf(b){
    var r=b.rec;
    var sx=Math.max(0, Math.round(b.x0*r.sx));
    var sy=Math.max(0, Math.round(b.t0*r.sy));
    var sw=Math.min(r.cv.width-sx,  Math.round((b.x1-b.x0)*r.sx));
    var sh=Math.min(r.cv.height-sy, Math.round((b.t1-b.t0)*r.sy));
    if(sw<4 || sh<4) return null;
    var c=document.createElement('canvas');
    c.width=sw; c.height=sh;
    c.getContext('2d').drawImage(r.cv, sx,sy,sw,sh, 0,0,sw,sh);
    return c.toDataURL('image/png');
  }
  function chosen(){
    var out=[];
    PAGES.forEach(function(p){
      p.boxes.forEach(function(b){ if(SEL[b.id]) out.push(b); });
    });
    return out;
  }

  /* ================= 오답노트 =================
     index.html 과 같은 양식입니다. 고치실 때는 두 파일을 함께 보세요. */
  var BOX3='<div class="sbox"><span>1회</span><span>2회</span><span>3회</span></div>';
  var NOTICE='영리적인 목적을 위하여 사용을 금합니다. · 줍줍닷컴';
  var MAKER='줍줍닷컴 · 만든이 : 허선생';
  var NOTE_Q=[['구하고자 하는 것은 무엇인가',              0.5, 3],
              ['문제해결에 활용된 지식은 무엇인가',          1, 6],
              ['어느 지점에서 막혔고, 그때 무엇을 시도했는가', 1, 6],
              ['다음에 같은 유형을 만나면 무엇부터 할 것인가', 1, 6]];
  function makeSheet(){
    var sh=document.createElement('div'); sh.className='sheet';
    var hd=document.createElement('div'); hd.className='shd'; hd.textContent=MAKER;
    var body=document.createElement('div'); body.className='sbody';
    sh.appendChild(hd); sh.appendChild(body);
    return {sheet:sh, body:body};
  }
  function numberSheets(P){
    var all=P.querySelectorAll('.sheet');
    for(var i=0;i<all.length;i++){
      var n=document.createElement('div'); n.className='pgn';
      n.innerHTML='<span class="pn">'+(i+1)+' / '+all.length+'</span>'+
        '<span class="cpr">'+esc(NOTICE)+'</span>';
      all[i].appendChild(n);
    }
  }
  function buildNote(){
    var list=chosen();
    if(!list.length){ toast('먼저 문항을 골라 주세요',true); return null; }
    var P=$('printArea'); P.innerHTML='';
    var lines=function(n){ var s=''; for(var i=0;i<n;i++) s+='<div></div>'; return s; };
    list.forEach(function(b){
      var src=cropOf(b); if(!src) return;
      var m=makeSheet();
      var L=document.createElement('div'); L.className='scol divider';
      L.innerHTML='<div class="sslot" style="flex:1">'+BOX3+
                  '<div class="slab">'+esc(labelOf(b))+'</div>'+
                  '<div class="simg"><img src="'+src+'"></div></div>';
      var R=document.createElement('div'); R.className='scol';
      var qs='';
      NOTE_Q.forEach(function(q,qi){
        qs+='<div class="nblk" style="flex:'+q[1]+'">'+
            '<div class="nq"'+(qi===0?' style="margin-top:0"':'')+'>'+(qi+1)+'. '+esc(q[0])+'</div>'+
            '<div class="nlines">'+lines(q[2])+'</div></div>';
      });
      R.innerHTML='<div class="sslot" style="flex:1">'+qs+'</div>';
      m.body.appendChild(L); m.body.appendChild(R); P.appendChild(m.sheet);
    });
    numberSheets(P);
    return P;
  }
  function labelOf(b){ return b.rec.pno+'쪽'; }

  function pdfName(){
    var d=new Date(), p=function(x){ return (x<10?'0':'')+x; };
    return '오답노트_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+
           p(d.getHours())+p(d.getMinutes())+'.pdf';
  }
  function pdfReady(){ return !!(window.jspdf && window.jspdf.jsPDF && window.html2canvas); }

  function askOutput(){
    var n=chosen().length;
    if(!n){ toast('먼저 문항을 골라 주세요',true); return; }
    modal('<h3>오답노트 내보내기</h3>'+
      '<p class="sub">고른 '+n+'문항을 어떻게 할까요? 한 문항에 한 장씩 만들어집니다.</p>'+
      '<div class="mb" style="justify-content:stretch;flex-direction:column;gap:8px">'+
        '<button class="primary" id="outPdf" style="width:100%;padding:12px">'+
          'PDF 파일로 저장'+(pdfReady()?'':' (준비 안 됨)')+'</button>'+
        '<button id="outPrint" style="width:100%;padding:12px">바로 인쇄</button>'+
        '<button id="outCancel" style="width:100%">취소</button>'+
      '</div>',
      function(){
        $('outCancel').onclick=closeModal;
        $('outPdf').disabled=!pdfReady();
        $('outPdf').onclick=function(){ closeModal(); step(3); makePdf(); };
        $('outPrint').onclick=function(){ closeModal(); step(3);
          var P=buildNote(); if(P) printWhenReady(P); };
      });
  }

  function printWhenReady(P){
    var imgs=P.querySelectorAll('img'), left=imgs.length, fired=false;
    var go=function(){ if(fired) return; fired=true; setTimeout(function(){ window.print(); }, 60); };
    if(!left) return go();
    var tick=function(){ if(--left<=0) go(); };
    Array.prototype.forEach.call(imgs,function(im){
      if(im.complete) tick(); else { im.onload=tick; im.onerror=tick; }
    });
    setTimeout(go, 20000);
  }

  function makePdf(){
    var P=buildNote(); if(!P) return;
    var sheets=P.querySelectorAll('.sheet');
    if(!sheets.length){ toast('만들 것이 없습니다',true); return; }
    P.classList.add('shoot');
    toast('오답노트 PDF를 만드는 중… ('+sheets.length+'장)');
    var pdf=new window.jspdf.jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
    var i=0;
    var stepOne=function(){
      if(i>=sheets.length){
        try{ pdf.save(pdfName()); toast('오답노트 PDF를 내려받았습니다'); }
        catch(e){ toast('PDF를 만들지 못했습니다 ('+(e.message||e)+')',true); }
        P.classList.remove('shoot');
        return;
      }
      window.html2canvas(sheets[i], {scale:2, backgroundColor:'#ffffff', logging:false, useCORS:true})
        .then(function(cv){
          if(i>0) pdf.addPage();
          pdf.addImage(cv.toDataURL('image/jpeg',0.92), 'JPEG', 10, 10, 190, 277);
          i++;
          if(i%3===0) toast('오답노트 PDF 만드는 중… '+i+' / '+sheets.length);
          setTimeout(stepOne,0);
        })
        .catch(function(err){
          P.classList.remove('shoot');
          toast('PDF를 만들지 못했습니다 ('+(err.message||err)+'). 인쇄 창을 엽니다.',true);
          setTimeout(function(){ printWhenReady(P); }, 600);
        });
    };
    stepOne();
  }

  /* ================= 쓰는 법 ================= */
  var HELP=[
   ['PDF를 열면 쪽마다 문항을 찾아 네모로 표시합니다',
    '글자가 들어 있는 PDF라면 «1.» «2.» 같은 문항 번호를 찾아 그 사이를 한 문항으로 봅니다. '+
    '두 단으로 짜인 시험지도 단을 알아서 나눕니다.'],
   ['한 번에 한 쪽씩, ← → 키로 넘깁니다',
    '쪽 전체가 화면에 들어오도록 높이에 맞춰 보여 드립니다. '+
    'Home 은 첫 쪽, End 는 마지막 쪽입니다.'],
   ['네모를 눌러 고르고, 다시 누르면 해제됩니다',
    '고른 것은 파랗게 채워집니다. 여러 쪽을 오가며 골라도 고른 것은 그대로 남습니다.'],
   ['경계가 어긋났으면 위·아래 선을 끌어 맞추세요',
    '네모의 맨 위나 맨 아래에 마우스를 대면 커서가 바뀝니다. 그대로 끌면 경계가 움직입니다.'],
   ['못 찾은 문항은 «직접 그리기»로 그려 넣으세요',
    '위쪽의 «직접 그리기»를 누른 뒤 문항을 감싸도록 끌면 새 네모가 생기고 바로 골라집니다. '+
    '글자가 없는 스캔본은 이 방법으로만 됩니다.'],
   ['잘못 만든 네모는 × 로 지웁니다',
    '네모에 마우스를 대면 오른쪽 위에 × 가 나타납니다.'],
   ['다 고르셨으면 «오답노트 만들기»',
    'PDF로 저장할지 바로 인쇄할지 물어봅니다. 한 문항에 한 장씩, '+
    '왼쪽에 문항 · 오른쪽에 네 가지 질문이 들어간 양식으로 만들어집니다.'],
   ['파일은 이 기기 밖으로 나가지 않습니다',
    'PDF를 읽고 자르고 오답노트를 만드는 일이 모두 브라우저 안에서 일어납니다. '+
    '어디에도 올리지 않으며, 인터넷을 끊고 쓰셔도 똑같이 됩니다. 창을 닫으면 그대로 사라집니다.']
  ];
  function openHelp(){
    var h='<h3>내 PDF로 오답노트 만들기</h3>'+
      '<p class="sub">여덟 가지만 아시면 됩니다.</p>'+
      '<div style="font-size:13.5px;line-height:1.7;max-height:60vh;overflow:auto">';
    HELP.forEach(function(t,i){
      h+='<p style="margin:0 0 10px"><b>'+(i+1)+'. '+esc(t[0])+'</b><br>'+
         '<span style="color:#6b7280">'+esc(t[1])+'</span></p>';
    });
    h+='</div><div class="mb"><button class="primary" id="helpOk">알겠습니다</button></div>';
    modal(h, function(){ $('helpOk').onclick=closeModal; });
  }

  /* ================= 이어 붙이기 ================= */
  $('pick').onclick=function(){ $('file').click(); };
  $('file').onchange=function(){ openFile(this.files && this.files[0]); this.value=''; };
  $('drop').addEventListener('dragover',function(e){ e.preventDefault(); this.classList.add('over'); });
  $('drop').addEventListener('dragleave',function(){ this.classList.remove('over'); });
  $('drop').addEventListener('drop',function(e){
    e.preventDefault(); this.classList.remove('over');
    openFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
  });
  $('prev').onclick=function(){ goPage(-1); };
  $('next').onclick=function(){ goPage(1); };
  $('mSel').onclick=function(){ setMode('sel'); };
  $('mDraw').onclick=function(){ setMode('draw'); };
  $('none').onclick=function(){
    Object.keys(SEL).forEach(function(k){ SEL[k].el.classList.remove('sel'); });
    SEL={}; updateCnt();
  };
  $('allPage').onclick=function(){
    var p=PAGES[CUR];
    if(!p || !p.boxes.length){ toast('이 쪽에는 찾은 문항이 없습니다',true); return; }
    p.boxes.forEach(function(b){ if(!SEL[b.id]) toggle(b); });
    toast(p.pno+'쪽을 전부 골랐습니다');
  };
  $('again').onclick=function(){
    DOC=null; PAGES=[]; SEL={}; CUR=0; $('pages').innerHTML='';
    $('tools').classList.remove('on'); $('drop').style.display=''; step(1); updateCnt();
  };
  $('make').onclick=askOutput;
  $('helpBtn').onclick=openHelp;
  document.addEventListener('keydown',function(e){
    if($('modal').classList.contains('open')){ if(e.key==='Escape') closeModal(); return; }
    if(e.ctrlKey||e.altKey||e.metaKey) return;
    if(e.key==='?' || (e.code==='Slash'&&e.shiftKey)){ e.preventDefault(); openHelp(); return; }
    if(!PAGES.length) return;
    if(e.key==='ArrowLeft'){ e.preventDefault(); goPage(-1); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); goPage(1); }
    else if(e.key==='Home'){ e.preventDefault(); showPage(0); }
    else if(e.key==='End'){ e.preventDefault(); showPage(PAGES.length-1); }
  });
  updateCnt();
})();
</script>
</body>
</html>
